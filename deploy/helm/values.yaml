replicaCount: 2

image:
  repository: ghcr.io/pavann19/modelgate
  tag: ""
  digest: ""
  # Explicit development escape hatch; never use for a release.
  allowMutableTags: false
  pullPolicy: IfNotPresent

failurePolicy: Fail
timeoutSeconds: 15

tls:
  secretName: modelgate-webhook-certs
  caBundle: ""

metrics:
  enabled: true
  serviceMonitor:
    enabled: false
    interval: 30s

# Operator-owned JSON; never generated from workload input.
registryPolicySecret: modelgate-registry-policy

# Requires a CNI that enforces NetworkPolicy. CIDRs are operator-owned,
# and must reflect control-plane/NAT behavior as observed in the target cluster.
networkPolicy:
  enabled: true
  apiServerCIDRs: []
  apiServerPorts: [443, 6443]
  registryEndpoints: [] # [{cidr: 203.0.113.10/32, port: 443}]
  metricsNamespaceSelector: {} # empty means no remote metrics access
