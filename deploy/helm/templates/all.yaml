apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-webhook
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-webhook
rules:
  - apiGroups: ["modelgate.dev"]
    resources: ["modelgatepolicies"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-webhook
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-webhook
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-webhook
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: modelgate, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: modelgate, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      serviceAccountName: {{ .Release.Name }}-webhook
      containers:
        - name: webhook
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--webhook-port=9443", "--cert-dir=/tmp/k8s-webhook-server/serving-certs", "--metrics-bind-address=:8080"]
          ports:
            - {name: webhook, containerPort: 9443}
            - {name: metrics, containerPort: 8080}
          readinessProbe: {tcpSocket: {port: webhook}}
          livenessProbe: {tcpSocket: {port: webhook}}
          volumeMounts:
            - {name: certs, mountPath: /tmp/k8s-webhook-server/serving-certs, readOnly: true}
      volumes:
        - name: certs
          secret: {secretName: {{ .Values.tls.secretName }}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-webhook
  labels: {app.kubernetes.io/name: modelgate, app.kubernetes.io/instance: {{ .Release.Name }}}
spec:
  selector: {app.kubernetes.io/name: modelgate, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports:
    - {name: webhook, port: 443, targetPort: webhook}
{{- if .Values.metrics.enabled }}
    - {name: metrics, port: 8080, targetPort: metrics}
{{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ .Release.Name }}
webhooks:
  - name: validate-pods.modelgate.dev
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: {{ .Values.failurePolicy }}
    timeoutSeconds: {{ .Values.timeoutSeconds }}
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["pods/ephemeralcontainers"]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system", {{ .Release.Namespace | quote }}]
    clientConfig:
      service:
        name: {{ .Release.Name }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /validate-pods
      caBundle: {{ required "tls.caBundle is required" .Values.tls.caBundle | quote }}
{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: modelgate, app.kubernetes.io/instance: {{ .Release.Name }}}
  endpoints:
    - port: metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end }}
