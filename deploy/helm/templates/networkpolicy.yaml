{{- if .Values.networkPolicy.enabled }}
{{- if not .Values.networkPolicy.apiServerCIDRs }}
{{- fail "networkPolicy.apiServerCIDRs is required for API ingress and policy reads" }}
{{- end }}
{{- if not .Values.networkPolicy.registryEndpoints }}
{{- fail "networkPolicy.registryEndpoints is required for signature retrieval" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-webhook
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: modelgate, app.kubernetes.io/instance: {{ .Release.Name }}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
{{- range .Values.networkPolicy.apiServerCIDRs }}
        - ipBlock: {cidr: {{ . | quote }}}
{{- end }}
      ports: [{protocol: TCP, port: 9443}]
{{- if and .Values.metrics.enabled .Values.networkPolicy.metricsNamespaceSelector }}
    - from:
        - namespaceSelector:
            matchLabels:
{{ toYaml .Values.networkPolicy.metricsNamespaceSelector | indent 14 }}
      ports: [{protocol: TCP, port: 8080}]
{{- end }}
  egress:
    - to:
{{- range .Values.networkPolicy.apiServerCIDRs }}
        - ipBlock: {cidr: {{ . | quote }}}
{{- end }}
      ports:
{{- range .Values.networkPolicy.apiServerPorts }}
        - {protocol: TCP, port: {{ . }}}
{{- end }}
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
{{- range .Values.networkPolicy.registryEndpoints }}
    - to:
        - ipBlock: {cidr: {{ .cidr | quote }}}
      ports: [{protocol: TCP, port: {{ .port }}}]
{{- end }}
{{- end }}
