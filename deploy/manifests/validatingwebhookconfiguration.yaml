# The ModelGate ValidatingWebhookConfiguration for a real cluster.
#
# failurePolicy is the fail-open/fail-closed switch measured in
# test/e2e/failurepolicy: Fail rejects every pod create/update while the
# webhook is unreachable (safe, but an outage of ModelGate itself blocks all
# scheduling); Ignore admits everything while unreachable (available, but an
# outage silently disables every check this webhook exists to enforce). See
# docs/DECISIONS.md for the trade-off and why Fail is the default here.
#
# This is deployed and proven against a real kind cluster -- see
# deploy/kind/deploy.sh and docs/DECISIONS.md's "kind cluster" section for
# how the certs and CA bundle are generated and injected (not committed
# here, since they're per-cluster and regenerated on every deploy).
#
# namespaceSelector below excludes kube-system and this webhook's own
# namespace: without it, this cluster-wide config would immediately deny
# every core cluster pod (CoreDNS, kube-proxy, ...) the moment it's
# installed, since M1's "no ModelGatePolicy means deny" default applies to
# them too and no cluster ships a ModelGatePolicy for kube-system out of the
# box. Excluding by namespace here (rather than requiring every cluster
# operator to remember to create an exempt ModelGatePolicy for kube-system)
# is a deliberate, minimal safety net -- it does not exempt kube-system from
# host-access/signature checks via policy (M1's exempt flag still exists for
# that, audited and logged), it just prevents this webhook from being able
# to accidentally deadlock its own cluster's control plane.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: modelgate
webhooks:
  - name: validate-pods.modelgate.dev
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail # or Ignore -- see the comment above before changing this
    # 5s (a common default) was tried first and timed out in a real kind
    # cluster smoke test: cosign verify's network round trip to a real
    # registry (TLS handshake + manifest + signature layer fetch) routinely
    # took close to 8s. 15s (Kubernetes' hard cap is 30s) is empirically
    # what this webhook actually needs when its check pipeline includes a
    # real network call, not an assumption -- see docs/DECISIONS.md.
    timeoutSeconds: 15
    rules:
      # UPDATE is required, not just CREATE: spec.containers[*].image is a
      # mutable field on an already-admitted Pod (this is how
      # `kubectl set image pod/x` works), so CREATE-only rules would let an
      # attacker swap in an unsigned/malicious image after admission and
      # never have it checked. See docs/DECISIONS.md ("M3 adversarial bypass
      # suite") -- this was empirically confirmed against a real API server,
      # not assumed.
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      # `kubectl debug` adds an ephemeral container via the
      # pods/ephemeralcontainers subresource, a distinct resource from
      # "pods" that the rule above does not match. Also empirically
      # confirmed to bypass the webhook entirely without this rule.
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["pods/ephemeralcontainers"]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system", "modelgate-system"]
    clientConfig:
      service:
        name: modelgate-webhook
        namespace: modelgate-system
        path: /validate-pods
      # caBundle: <injected by your certificate provisioning mechanism,
      # e.g. cert-manager's CA injector -- not yet wired up, see
      # docs/DECISIONS.md>
