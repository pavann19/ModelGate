apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: modelgate
webhooks:
  - name: validate-pods.modelgate.dev
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 15
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["pods/ephemeralcontainers"]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system", "modelgate-system"]
    clientConfig:
      service:
        name: modelgate-webhook
        namespace: modelgate-system
        path: /validate-pods
      # caBundle: <injected by your certificate provisioning mechanism,
      # e.g. cert-manager's CA injector -- not yet wired up, see
      # docs/HELM_INSTALL.md>
