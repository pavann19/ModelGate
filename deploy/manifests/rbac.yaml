apiVersion: v1
kind: ServiceAccount
metadata:
  name: modelgate-webhook
  namespace: modelgate-system
---
# The webhook resolves the ModelGatePolicy for a pod's namespace on every
# admission request via a direct (uncached) API read -- see
# internal/policy.Resolver and docs/DECISIONS.md for why -- so it needs
# read access to that CRD across all namespaces, not just its own.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: modelgate-webhook
rules:
  - apiGroups: ["modelgate.dev"]
    resources: ["modelgatepolicies"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: modelgate-webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: modelgate-webhook
subjects:
  - kind: ServiceAccount
    name: modelgate-webhook
    namespace: modelgate-system
