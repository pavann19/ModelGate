name: Analysis worker
on:
  push:
    branches: [main, 'codex/publication-20261031']
  pull_request:
permissions:
  contents: read
jobs:
  worker:
    runs-on: ubuntu-latest
    container: python:3.12-slim@sha256:09f7da3bc104798d0afb40bc08d23ab2da20a76130cec1f2ef170848f5d85217
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Test durable queue and hostile proposal boundaries
        run: python3 -B -m unittest discover -s agent -v
