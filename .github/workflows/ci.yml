name: CI

env:
  SETUP_ENVTEST_VERSION: v0.0.0-20250308055145-5fe7bb3edc86
  ENVTEST_K8S_VERSION: 1.31.0

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Scan reachable history
        run: >-
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --log-opts=--all --redact --no-banner

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
      # test/e2e/... and bench/... require KUBEBUILDER_ASSETS (a real
      # kube-apiserver + etcd) -- that's the envtest job below, not this one.
      # test/cosign/... requires the real cosign binary -- that's the
      # cosign-integration job below, not this one.
      - name: Build, vet, and run unit tests
        run: |
          set -o pipefail
          {
            go build ./...
            go vet ./...
            go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
            mapfile -t packages < <(go list ./... | grep -vE '/(test/e2e|bench|test/cosign)')
            go test "${packages[@]}" -v -race -coverprofile=coverage.out
          } 2>&1 | tee unit-tests-output.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: unit-tests-output
          path: unit-tests-output.txt

  envtest:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
      - name: Install setup-envtest
        run: go install "sigs.k8s.io/controller-runtime/tools/setup-envtest@${SETUP_ENVTEST_VERSION}"
      - name: Download envtest binaries (kube-apiserver, etcd)
        id: envtest-assets
        run: echo "path=$(setup-envtest use "${ENVTEST_K8S_VERSION}" -p path)" >> "$GITHUB_OUTPUT"
      - name: Run envtest suites against a real API server
        env:
          KUBEBUILDER_ASSETS: ${{ steps.envtest-assets.outputs.path }}
        run: |
          set -o pipefail
          go test ./test/e2e/... -v -timeout 120s 2>&1 | tee envtest-output.txt
      - name: Run admission latency benchmark against a real API server
        env:
          KUBEBUILDER_ASSETS: ${{ steps.envtest-assets.outputs.path }}
        run: |
          set -o pipefail
          go test ./bench/ -run TestAdmissionLatency -v -timeout 120s 2>&1 | tee envtest-benchmark-output.txt
      - name: Native API admission with real registry trust and measured overhead
        env:
          KUBEBUILDER_ASSETS: ${{ steps.envtest-assets.outputs.path }}
          MODELGATE_NATIVE_ADMISSION: '1'
          MODELGATE_EVIDENCE_DIR: artifacts/native-admission
        run: |
          set -o pipefail
          mkdir -p artifacts/native-admission
          go test ./test/cosign -run '^TestNativeAdmissionTrustAndOverhead$' -v -count=1 -timeout 120s 2>&1 | tee native-admission-output.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: admission-latency
          path: bench/results/admission_latency.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: envtest-output
          path: |
            envtest-output.txt
            envtest-benchmark-output.txt
            native-admission-output.txt
            artifacts/native-admission/admission-performance.json
          if-no-files-found: ignore

  fuzz-pickle:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
      - name: Fuzz the pickle detector against safetensors/ONNX/GGUF-shaped inputs
        run: |
          set -o pipefail
          go test ./internal/pickle/ -fuzz=FuzzIsPickle_RealFormatsNotFlagged -fuzztime=30s 2>&1 | tee fuzz-pickle-output.txt
      - name: Fuzz registry and verification trust parsers
        shell: bash
        run: |
          set -o pipefail
          for target in FuzzRegistryJSONKeys FuzzBearerChallenge FuzzBoundedVerificationKey; do
            go test ./internal/webhook -run '^$' -fuzz "^${target}$" -fuzztime=10s -parallel=2 2>&1 | tee "${target}-output.txt"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: fuzz-pickle-output
          path: |
            fuzz-pickle-output.txt
            Fuzz*-output.txt

  cosign-integration:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Verify CosignVerifier against a real signed and a real unsigned image
        run: |
          set -o pipefail
          go test ./test/cosign/... -v -timeout 120s 2>&1 | tee cosign-integration-output.txt
      - name: Independent pinned Cosign cryptographic interoperability
        env:
          MODELGATE_REQUIRE_COSIGN_ORACLE: '1'
        run: go test ./internal/webhook -run '^TestDetachedSignatureCosignInteroperability$' -v -count=1 -timeout 60s
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cosign-integration-output
          path: cosign-integration-output.txt

  helm-chart:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.16.4
      - name: Lint and render the Helm chart
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          helm lint deploy/helm \
            -f deploy/helm/hardening-test-values.yaml \
            2>&1 | tee artifacts/helm-lint-output.txt
          helm template modelgate deploy/helm \
            --namespace modelgate-system \
            -f deploy/helm/hardening-test-values.yaml \
            2>&1 | tee artifacts/helm-template-output.yaml >/dev/null
      - name: Assert Helm refuses a missing CA bundle
        shell: bash
        run: |
          set -o pipefail
          if helm template modelgate deploy/helm -f deploy/helm/hardening-test-values.yaml \
            --set-string tls.caBundle= > artifacts/helm-missing-ca-output.txt 2>&1; then
            cat artifacts/helm-missing-ca-output.txt
            echo "expected helm template to fail when tls.caBundle is omitted"
            exit 1
          fi
          cat artifacts/helm-missing-ca-output.txt
          grep -q 'tls.caBundle is required' artifacts/helm-missing-ca-output.txt
      - name: Assert rendered isolation and reject unsafe overrides
        run: |
          python3 -m pip install PyYAML==6.0.3
          python3 -B hack/test_helm_hardening.py -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: helm-chart-output
          path: artifacts/helm-*
          if-no-files-found: error

  # Real hardened deployment, private TLS OCI fixture and real pinned cosign.
  # Server dry-runs assert admission, not scheduling or kubelet image pulls.
  kind-smoke:
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        with:
          cluster_name: modelgate
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Deploy to kind and assert admission behaviour
        shell: bash
        run: |
          set -o pipefail
          python3 deploy/kind/private-registry-smoke.py 2>&1 | tee kind-smoke-output.txt
      - name: Measure real admission and controlled failure recovery
        run: |
          set -o pipefail
          python3 deploy/kind/platform-eval.py \
            --context kind-modelgate \
            --confirm-disposable-cluster kind-modelgate \
            --bootstrap artifacts/private-kind/fixture-bootstrap.txt \
            --output artifacts/platform-eval 2>&1 | tee platform-eval-output.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: kind-smoke-output
          path: |
            kind-smoke-output.txt
            artifacts/private-kind/admission-results.json
            platform-eval-output.txt
            artifacts/platform-eval/*.json
            artifacts/platform-eval/*.log
