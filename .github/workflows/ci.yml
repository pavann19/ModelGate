name: CI

env:
  SETUP_ENVTEST_VERSION: v0.0.0-20250308055145-5fe7bb3edc86
  ENVTEST_K8S_VERSION: 1.31.0

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
      # test/e2e/... and bench/... require KUBEBUILDER_ASSETS (a real
      # kube-apiserver + etcd) -- that's the envtest job below, not this one.
      # test/cosign/... requires the real cosign binary -- that's the
      # cosign-integration job below, not this one.
      - name: Build, vet, and run unit tests
        run: |
          set -o pipefail
          {
            go build ./...
            go vet ./...
            go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
            go test $(go list ./... | grep -vE '/(test/e2e|bench|test/cosign)') -v -race -coverprofile=coverage.out
          } 2>&1 | tee unit-tests-output.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: unit-tests-output
          path: unit-tests-output.txt

  envtest:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
      - name: Install setup-envtest
        run: go install sigs.k8s.io/controller-runtime/tools/setup-envtest@${SETUP_ENVTEST_VERSION}
      - name: Download envtest binaries (kube-apiserver, etcd)
        id: envtest-assets
        run: echo "path=$(setup-envtest use ${ENVTEST_K8S_VERSION} -p path)" >> "$GITHUB_OUTPUT"
      - name: Run envtest suites against a real API server
        env:
          KUBEBUILDER_ASSETS: ${{ steps.envtest-assets.outputs.path }}
        run: |
          set -o pipefail
          go test ./test/e2e/... -v -timeout 120s 2>&1 | tee envtest-output.txt
      - name: Run admission latency benchmark against a real API server
        env:
          KUBEBUILDER_ASSETS: ${{ steps.envtest-assets.outputs.path }}
        run: |
          set -o pipefail
          go test ./bench/ -run TestAdmissionLatency -v -timeout 120s 2>&1 | tee envtest-benchmark-output.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: admission-latency
          path: bench/results/admission_latency.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: envtest-output
          path: |
            envtest-output.txt
            envtest-benchmark-output.txt
          if-no-files-found: ignore

  fuzz-pickle:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
      - name: Fuzz the pickle detector against safetensors/ONNX/GGUF-shaped inputs
        run: |
          set -o pipefail
          go test ./internal/pickle/ -fuzz=FuzzIsPickle_RealFormatsNotFlagged -fuzztime=30s 2>&1 | tee fuzz-pickle-output.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: fuzz-pickle-output
          path: fuzz-pickle-output.txt

  cosign-integration:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: v2.4.1
      - name: Verify CosignVerifier against a real signed and a real unsigned image
        run: |
          set -o pipefail
          go test ./test/cosign/... -v -timeout 120s 2>&1 | tee cosign-integration-output.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cosign-integration-output
          path: cosign-integration-output.txt

  helm-chart:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.16.4
      - name: Lint and render the Helm chart
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          helm lint deploy/helm \
            --set-string tls.caBundle=dGVzdC1jYS1idW5kbGU= \
            2>&1 | tee artifacts/helm-lint-output.txt
          helm template modelgate deploy/helm \
            --namespace modelgate-system \
            --set-string tls.caBundle=dGVzdC1jYS1idW5kbGU= \
            --set image.repository=ghcr.io/pavann19/modelgate \
            --set image.tag=ci-render \
            2>&1 | tee artifacts/helm-template-output.yaml >/dev/null
      - name: Assert Helm refuses a missing CA bundle
        shell: bash
        run: |
          set -o pipefail
          if helm template modelgate deploy/helm > artifacts/helm-missing-ca-output.txt 2>&1; then
            cat artifacts/helm-missing-ca-output.txt
            echo "expected helm template to fail when tls.caBundle is omitted"
            exit 1
          fi
          cat artifacts/helm-missing-ca-output.txt
          grep -q 'tls.caBundle is required' artifacts/helm-missing-ca-output.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: helm-chart-output
          path: artifacts/helm-*
          if-no-files-found: error

  # Real hardened deployment, private TLS OCI fixture and real pinned cosign.
  # Server dry-runs assert admission, not scheduling or kubelet image pulls.
  kind-smoke:
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        with:
          cluster_name: modelgate
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: v2.4.1
      - name: Deploy to kind and assert admission behaviour
        shell: bash
        run: |
          set -o pipefail
          python3 deploy/kind/private-registry-smoke.py 2>&1 | tee kind-smoke-output.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: kind-smoke-output
          path: |
            kind-smoke-output.txt
            artifacts/private-kind/admission-results.json
