name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go build ./...
      - run: go vet ./...
      # test/e2e/... and bench/... require KUBEBUILDER_ASSETS (a real
      # kube-apiserver + etcd) -- that's the envtest job below, not this one.
      # test/cosign/... requires the real cosign binary -- that's the
      # cosign-integration job below, not this one.
      - run: go test $(go list ./... | grep -vE '/(test/e2e|bench|test/cosign)') -v -race -coverprofile=coverage.out
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  envtest:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install setup-envtest
        run: go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
      - name: Download envtest binaries (kube-apiserver, etcd)
        id: envtest-assets
        run: echo "path=$(setup-envtest use 1.31.0 -p path)" >> "$GITHUB_OUTPUT"
      - name: Run envtest suites against a real API server
        env:
          KUBEBUILDER_ASSETS: ${{ steps.envtest-assets.outputs.path }}
        run: go test ./test/e2e/... -v -timeout 120s
      - name: Run admission latency benchmark against a real API server
        env:
          KUBEBUILDER_ASSETS: ${{ steps.envtest-assets.outputs.path }}
        run: go test ./bench/ -run TestAdmissionLatency -v -timeout 120s
      - uses: actions/upload-artifact@v4
        with:
          name: admission-latency
          path: bench/results/admission_latency.json

  fuzz-pickle:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Fuzz the pickle detector against safetensors/ONNX/GGUF-shaped inputs
        run: go test ./internal/pickle/ -fuzz=FuzzIsPickle_RealFormatsNotFlagged -fuzztime=30s

  cosign-integration:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: sigstore/cosign-installer@v3
      - name: Verify CosignVerifier against a real signed and a real unsigned image
        run: go test ./test/cosign/... -v -timeout 120s
